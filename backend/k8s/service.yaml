apiVersion: v1
kind: Service
metadata:
  name: realsite-backend
  namespace: default
  labels:
    app.kubernetes.io/name: realsite-backend
    app.kubernetes.io/managed-by: containerization-assist
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: realsite-backend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: default
  labels:
    app.kubernetes.io/name: realsite-backend
    app.kubernetes.io/managed-by: containerization-assist
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: realsite-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: default
  labels:
    app.kubernetes.io/name: realsite-redis
    app.kubernetes.io/managed-by: containerization-assist
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: realsite-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP

apiVersion: apps/v1
kind: Deployment
metadata:
  name: realsite-backend
  namespace: default
  labels:
    app.kubernetes.io/name: realsite-backend
    app.kubernetes.io/managed-by: containerization-assist
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: realsite-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: realsite-backend
        app.kubernetes.io/managed-by: containerization-assist
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: realsite-backend
          image: yashuraj/realsite-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PORT
              value: "8000"
          envFrom:
            - configMapRef:
                name: realsite-backend-config
            - secretRef:
                name: realsite-backend-secret
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: realsite-uploads
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realsite-redis
  namespace: default
  labels:
    app.kubernetes.io/name: realsite-redis
    app.kubernetes.io/managed-by: containerization-assist
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: realsite-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: realsite-redis
        app.kubernetes.io/managed-by: containerization-assist
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - 128mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: realsite-redis-data
        - name: tmp
          emptyDir: {}

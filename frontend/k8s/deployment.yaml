apiVersion: apps/v1
kind: Deployment
metadata:
  name: realsite-frontend
  namespace: default
  labels:
    app.kubernetes.io/name: realsite-frontend
    app.kubernetes.io/managed-by: containerization-assist
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: realsite-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: realsite-frontend
        app.kubernetes.io/managed-by: containerization-assist
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: realsite-frontend
          image: yashuraj/realsite-frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
